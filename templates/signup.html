{% extends "base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="page-content">
  <div class="max-w-md mx-auto bg-white/90 backdrop-blur rounded-2xl shadow-xl p-8 animate-[fadeIn_0.5s_ease-out]">
    <h1 class="text-2xl font-bold text-center text-[var(--primary,#8B4513)] mb-6">ثبت‌نام</h1>
    {% if error %}
    <div class="mb-4 rounded-xl bg-red-50 text-red-700 p-3 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="block mb-1 font-semibold">نام کاربری</label>
        <input name="username" required class="w-full border-2 border-gray-200 focus:border-primary rounded-xl px-4 py-3 outline-none transition"/>
      </div>
      <div>
        <label class="block mb-1 font-semibold">رمز عبور</label>
        <input type="password" name="password" required class="w-full border-2 border-gray-200 focus:border-primary rounded-xl px-4 py-3 outline-none transition"/>
      </div>
      <div>
        <label class="block mb-1 font-semibold">شماره تلفن</label>
        <input name="phone" pattern="[0-9]+" class="w-full border-2 border-gray-200 focus:border-primary rounded-xl px-4 py-3 outline-none transition"/>
      </div>
      <button class="w-full bg-[#8B4513] hover:bg-[#A0522D] text-white font-semibold py-3 rounded-xl transition">ثبت‌نام</button>
    </form>
    <p class="text-center text-sm mt-4">حساب دارید؟ <a href="{{ url_for('login') }}" class="text-[#8B4513] underline">ورود</a></p>
  </div>
</div>
{% endblock %}
